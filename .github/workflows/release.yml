name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install application dependencies
        run: yarn install --frozen-lockfile

      - name: Build offline web app
        run: yarn build

      - name: Install desktop packaging dependencies
        run: npm install --no-audit --no-fund --prefix desktop

      - name: Package portable Windows executable
        run: npm run dist:win --prefix desktop

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: desktop/dist/*.exe
